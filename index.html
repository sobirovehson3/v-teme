<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В ТЕМЕ - Кофейня</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #d4a574 0%, #8b6f47 50%, #3d3020 100%);
            color: #2c1810;
            overflow-x: hidden;
        }

        /* Фон с текстурой пустыни */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255,200,100,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(210,140,70,0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* ХЕДЕР */
        header {
            background: linear-gradient(180deg, rgba(61,48,32,0.95) 0%, rgba(90,60,30,0.9) 100%);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid #d4a574;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 3.5em;
            color: #f4d03f;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8), 0 0 20px rgba(244,208,63,0.3);
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .tagline {
            color: #d4a574;
            font-size: 1.2em;
            font-style: italic;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        /* КОНТЕЙНЕР */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* РАЗДЕЛ МЕНЮ */
        .menu-section {
            background: linear-gradient(135deg, rgba(255,245,230,0.95) 0%, rgba(240,220,190,0.95) 100%);
            border-radius: 20px;
            padding: 40px;
            margin: 40px 0;
            border: 3px solid #8b6f47;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4), inset 0 0 30px rgba(212,165,116,0.3);
            position: relative;
            overflow: hidden;
        }

        .menu-section::before {
            content: '☕';
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 60px;
            opacity: 0.1;
        }
